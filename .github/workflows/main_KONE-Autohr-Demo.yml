name: Deploy AutoHR Frontend to Azure App Service

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Deployment Mode"
        required: true
        default: "ui_only"
        type: choice
        options:
          - "ui_only"
          - "connected"
      api_base_url:
        description: "Production Backend HTTPS URL (Required for 'connected' mode, e.g. https://api-demo.yourdomain.com)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate inputs and build frontend (Nitro node-server)
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          INPUT_API_URL: ${{ inputs.api_base_url }}
          REPO_API_URL: ${{ vars.VITE_API_BASE_URL }}
          NITRO_PRESET: node-server
        run: |
          echo "Processing build for mode: $DEPLOYMENT_MODE"
          if [ "$DEPLOYMENT_MODE" = "ui_only" ]; then
            echo "Deploying in UI-only mode: live backend connection disabled."
            export VITE_APP_MODE="ui_only"
            export VITE_API_BASE_URL="ui_only"
          elif [ "$DEPLOYMENT_MODE" = "connected" ]; then
            RESOLVED_URL="${INPUT_API_URL:-$REPO_API_URL}"
            if [ -z "$RESOLVED_URL" ]; then
              echo "::error::CRITICAL: 'connected' mode requires a valid HTTPS backend URL. Provide 'api_base_url' input or configure repository variable 'VITE_API_BASE_URL'."
              exit 1
            fi
            # Strict HTTPS check
            if [[ ! "$RESOLVED_URL" =~ ^https:// ]]; then
              echo "::error::SECURITY VIOLATION: Backend URL must start with 'https://'. Insecure HTTP or malformed URLs are rejected: $RESOLVED_URL"
              exit 1
            fi
            # Loopback and local address rejection
            LOWER_URL=$(echo "$RESOLVED_URL" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER_URL" =~ (localhost|127\.|0\.0\.0\.0|\[::1\]) ]]; then
              echo "::error::SECURITY VIOLATION: Production build must not point to loopback or local address: $RESOLVED_URL"
              exit 1
            fi
            export VITE_APP_MODE="connected"
            export VITE_API_BASE_URL="$RESOLVED_URL"
            echo "Connected mode enabled with backend endpoint."
          else
            echo "::error::Unrecognized deployment mode: $DEPLOYMENT_MODE"
            exit 1
          fi

          npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -f .output/server/index.mjs ]; then
            echo "::error::Build verification failed: .output/server/index.mjs does not exist!"
            exit 1
          fi
          if [ ! -d .output/public ]; then
            echo "::error::Build verification failed: .output/public does not exist!"
            exit 1
          fi
          echo "Verified Nitro node-server artifact exists."

      - name: Package deployment artifact (.output directory)
        run: |
          cd .output
          zip -r ../deploy-package.zip .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (KONE-Autohr-Demo)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "KONE-Autohr-Demo"
          package: frontend/deploy-package.zip
          startup-command: "node server/index.mjs"
